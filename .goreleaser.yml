version: 2
project_name: chanify
builds:
- env:
    - CGO_ENABLED=0
  goos:
    - linux
    - darwin
    - windows
  goarch:
    - amd64
    - arm
    - arm64
  ignore:
    - goos: darwin
      goarch: arm
    - goos: windows
      goarch: arm
    - goos: windows
      goarch: arm64
  mod_timestamp: '{{ .CommitTimestamp }}'
  flags:
    - -trimpath
    - -mod=readonly
  ldflags:
    - -s -w -X github.com/chanify/chanify/cmd.Version={{.Version}} -X github.com/chanify/chanify/cmd.GitCommit={{.ShortCommit}} -X github.com/chanify/chanify/cmd.BuildTime={{.Date}}
changelog:
  sort: asc
  filters:
    exclude:
    - '^[^:]*$'
    - '^docs:'
    - '^test:'
archives:
  - name_template: '{{ .ProjectName }}_{{ if eq .Os "darwin" }}Darwin{{ else if eq .Os "linux" }}Linux{{ else if eq .Os "windows" }}Windows{{ else }}{{ .Os }}{{ end }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README-zh_CN.md
      - AGENT_GUIDE.md
      - SECURITY.md
      - plugin/**/*.lua
      - example/**/*.js
