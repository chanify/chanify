name: ci

on:
  push:
    branches: [ main, dev ]
    tags:
      - v*
  pull_request:

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.20.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Code lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Test
        run: make test
      - name: Code coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Select Go version and image tag
        env:
          REF: ${{ github.ref }}
        run: |
          echo "GO_VERSION=$(awk '$1 == "go" { print $2; exit }' go.mod)" >> "$GITHUB_ENV"
          case "$REF" in
            refs/heads/dev) tag=dev ;;
            refs/heads/main) tag=latest ;;
            refs/tags/v*) tag="${REF#refs/tags/v}" ;;
            *) exit 1 ;;
          esac
          echo "DOCKER_TAGS=wizjin/chanify:$tag" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          build-args: GO_VERSION=${{ env.GO_VERSION }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
